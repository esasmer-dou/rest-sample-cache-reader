# Opt-in overlay: -Dreactor.config.file=src/main/resources/config/l1.properties
# Keep all other projections Redis-only. These settings do not bypass Java handlers/authentication.
sample.cache.customer.l1.max-entries=0

# Small customer details: at most 16 payloads of 2 KiB; larger values remain Redis-only.
sample.cache.customer.detail.l1.max-entries=16
sample.cache.customer.detail.l1.max-entry-bytes=2048
sample.cache.customer.detail.l1.max-key-chars=256
sample.cache.customer.detail.l1.max-bytes=65536
sample.cache.customer.detail.l1.max-age-ms=1000

# Segment lists: at most four payloads of 32 KiB. Larger responses bypass L1.
sample.cache.customer.segment.l1.max-entries=4
sample.cache.customer.segment.l1.max-entry-bytes=32768
sample.cache.customer.segment.l1.max-key-chars=256
sample.cache.customer.segment.l1.max-bytes=163840
sample.cache.customer.segment.l1.max-age-ms=1000

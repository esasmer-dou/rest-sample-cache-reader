server.host=0.0.0.0
server.port=8080
reactor.runtime.profile=micro-rest
sample.stock.base-url=http://127.0.0.1:8082
sample.outbound.enabled=true
sample.backend.enabled=false
sample.diagnostics.enabled=false
sample.outbound.breaker.enabled=true
sample.edge.jwt.enabled=false
reactor.security.enabled=true
reactor.security.jwt.issuer=sample-issuer
reactor.security.jwt.audience=stock-api
reactor.security.jwt.require-expiration=true
reactor.security.jwt.clock-skew-seconds=0
reactor.security.jwt.max-token-chars=8192
reactor.http-client.transport=rust-native
reactor.http-client.threads=1
reactor.http-client.native.completion-threads=1
# Eight route permits plus one still-running completion on the dedicated worker.
reactor.http-client.max-inflight=9
reactor.http-client.native.max-connections=8
reactor.http-client.native.max-idle-per-origin=8
reactor.http-client.native.byte-budget-bytes=3145728
reactor.http-client.max-request-bytes=16
reactor.http-client.max-response-bytes=8192
reactor.http-client.max-headers=16
reactor.http-client.native.max-header-bytes=8192
reactor.http-client.retries=0
reactor.http-client.request-timeout-ms=2000
reactor.rust.route-budget.stock.route-admission.max-concurrent=8
reactor.rust.route-budget.stock.route-admission.queue-timeout-ms=125

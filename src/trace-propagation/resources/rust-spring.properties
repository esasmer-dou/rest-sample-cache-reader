server.host=0.0.0.0
server.port=8080
reactor.runtime.profile=micro-rest
sample.api.enabled=true
sample.inventory.enabled=false
sample.inventory.base-url=http://127.0.0.1:8082
sample.diagnostics.enabled=false
reactor.tracing.enabled=true
reactor.tracing.annotated-only=true
reactor.tracing.sample-ratio=0.01
reactor.http-client.transport=rust-native
reactor.http-client.threads=1
reactor.http-client.native.completion-threads=1
reactor.http-client.max-inflight=9
reactor.http-client.native.max-connections=8
reactor.http-client.native.max-idle-per-origin=8
reactor.http-client.native.byte-budget-bytes=3145728
reactor.http-client.max-request-bytes=16
reactor.http-client.max-response-bytes=8192
reactor.http-client.max-headers=16
reactor.http-client.native.max-header-bytes=8192
reactor.http-client.retry-backoff-ms=1
reactor.rust.route-budget.inventory.route-admission.max-concurrent=8
reactor.rust.route-budget.inventory.route-admission.queue-timeout-ms=1000

# Separate build profile: no customer data, authentication bypass or business side effects.
server.host=0.0.0.0
server.port=8080
reactor.runtime.profile=micro-rest
reactor.cache.redis.host=127.0.0.1
reactor.cache.redis.port=6379
reactor.cache.redis.access-mode=read-only
reactor.cache.redis.read-connections=2
reactor.cache.redis.max-read-inflight=8
reactor.cache.redis.max-response-bytes=16384

# Disabled unless explicitly enabled at startup with an edge-cache native artifact.
sample.public.edge.enabled=false
sample.public.catalog.namespace=public.catalog
sample.public.catalog.projections=product
sample.public.catalog.product.namespace=public.catalog.product
sample.public.catalog.version-cache-ms=1000
sample.public.catalog.max-age-ms=60000
sample.public.catalog.serve-stale=false
